<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Ville Heikkiniemi">

    <link rel="icon" href="favicon.ico">

    <title>Contact | Centria Edu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header and Navigation -->

    <header>
        <div class="container">

            <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="index.html#topics">Topics</a>
                    </li>

                    <li>
                        <a href="index.html#about">About</a>
                    </li>

                    <li>
                        <a href="gallery.html">Gallery</a>
                    </li>

                    <li>
                        <a href="contact.html" aria-current="page">Contact</a>
                    </li>
                </ul>
            </nav>

        </div>
    </header>


    <!-- Contact Form Section -->

    <main>

        <section class="topics" id="contact">

            <div class="container">

                <h2>Contact us</h2>

                <p>
                    Please fill out the form below to contact us.
                    We will get back to you as soon as possible.
                </p>


                <form
                    class="card"
                    action="https://httpbin.org/post"
                    method="post">


                    <!-- Name -->

                    <div class="form-group">

                        <label for="name">Name</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required>

                    </div>


                    <!-- Email Address -->

                    <div class="form-group">

                        <label for="email">Email address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required>

                    </div>


                    <!-- Phone Number -->

                    <div class="form-group">

                        <label for="phone">Phone number (Optional)</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            autocomplete="tel">

                    </div>


                    <!-- Contact Subject -->

                    <div class="form-group">

                        <label for="subject">Contact subject</label>

                        <select
                            id="subject"
                            name="subject"
                            required>

                            <option value="">Choose a subject</option>

                            <option value="feedback">Feedback</option>

                            <option value="question">Question</option>

                            <option value="support">Technical Support</option>

                            <option value="other">Other</option>

                        </select>

                    </div>


                    <!-- Preferred Contact Method -->

                    <fieldset class="form-group">

                        <legend>Preferred contact method</legend>

                        <label>
                            <input
                                type="radio"
                                name="contact_method"
                                value="email">

                            Email
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="contact_method"
                                value="phone">

                            Phone
                        </label>

                    </fieldset>


                    <!-- Message -->

                    <div class="form-group">

                        <label for="message">Message</label>

                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                            required></textarea>

                    </div>


                    <!-- Submit Button -->

                    <button type="submit" class="button">
                        Submit
                    </button>


                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <div class="container">

            <p>&copy; 2026 Centria Edu</p>

        </div>

    </footer>

</body>

</html>
