<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autumn Gallery in Finland</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Autumn in Finland</h1>
        <p>The beauty of Finnish autumn through my camera</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
    </nav>

    <main>
        <section class="gallery">

            <h2>My Autumn Photo Gallery</h2>

            <p>
                These photographs show the beautiful colours of autumn in Finland.
                I took these photos myself and wanted to share these autumn memories.
            </p>

            <div class="photo-container">

                <figure>
                    <img
                        src="images/IMG_0701.JPG.jpeg"
                        alt="A tree with bright red autumn leaves"
                    >
                    <figcaption>Beautiful Red Autumn Leaves</figcaption>
                </figure>

                <figure>
                    <img
                        src="images/IMG_0892.JPG.jpeg"
                        alt="A colourful autumn park with trees and a bench"
                    >
                    <figcaption>A Colourful Autumn Park</figcaption>
                </figure>

                <figure>
                    <img
                        src="images/IMG_0944.JPG.jpeg"
                        alt="Yellow and orange autumn trees beside a walking path"
                    >
                    <figcaption>A Peaceful Autumn Walk</figcaption>
                </figure>

            </div>

        </section>
    </main>

    <footer>
        <p>My Autumn Memories in Finland</p>
    </footer>

</body>
</html>
